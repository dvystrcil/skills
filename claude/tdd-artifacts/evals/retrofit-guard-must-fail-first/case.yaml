schema_version: "1.0"
name: retrofit-guard-must-fail-first
description: >-
  Source: tdd-artifacts case 2 and memory feedback_gate_true_before_the_change
  ("a guard nobody has seen fail is indistinguishable from a guard that cannot
  fail"). Every manifest already has a memory limit, so a new guard passes on
  its first run whatever it checks. The agent must manufacture RED: inject the
  defect, see the guard fail, and restore the tree.
tags: [tdd-artifacts, default]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Edit, Write, Skill, Glob, Grep]
  prompt: |
    Last month a container with no memory limit took a node down. Add a test
    to tests/test_manifests.py that fails if any Deployment container in k8s/
    has no memory limit. Don't commit. I'm AFK, so don't ask me questions.
runs: 3
graders:
  - name: guard-added
    type: regex
    target: {source: file, path: tests/test_manifests.py}
    pattern: 'limits'
    arm: both
  # A unittest/pytest run that reported a failure: the guard was seen to fire.
  - name: guard-seen-failing
    type: regex
    target: trace
    pattern: 'FAILED \((?:failures|errors)=\d|\b\d+ failed\b'
  # Whatever was mutated to get RED is back: every manifest keeps its limit
  # (0.2 each, so the five together weigh as one grader).
  - name: restored-api
    type: regex
    target: {source: file, path: k8s/api.yaml}
    pattern: '^            limits:\n              memory: \d+Mi$'
    flags: m
    weight: 0.2
    arm: both
  - name: restored-web
    type: regex
    target: {source: file, path: k8s/web.yaml}
    pattern: '^            limits:\n              memory: \d+Mi$'
    flags: m
    weight: 0.2
    arm: both
  - name: restored-worker
    type: regex
    target: {source: file, path: k8s/worker.yaml}
    pattern: '^            limits:\n              memory: \d+Mi$'
    flags: m
    weight: 0.2
    arm: both
  - name: restored-scheduler
    type: regex
    target: {source: file, path: k8s/scheduler.yaml}
    pattern: '^            limits:\n              memory: \d+Mi$'
    flags: m
    weight: 0.2
    arm: both
  - name: restored-notifier
    type: regex
    target: {source: file, path: k8s/notifier.yaml}
    pattern: '^            limits:\n              memory: \d+Mi$'
    flags: m
    weight: 0.2
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: tdd-artifacts
