name: secret-scan
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    # GitHub-hosted, not skills-runner (argocd-projects#356): this repo is
    # PUBLIC, so a PR runs code anyone can write. gitleaks needs no secret
    # and nothing in the cluster, and standard GitHub-hosted runners are free
    # for public repos. Jobs that read Infisical (rebuild-configmap,
    # skill-evals-claude) stay self-hosted: they run only from main or by hand.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists PR commits via the API
    steps:
      # Checkout (PR head SHA, full history) + gitleaks live in the action, so
      # a fix ships to every repo by moving v1 (homelab#2079).
      - uses: dvystrcil/secret-scan-action@v1
