name: validate-skills

# Fails the PR before merge if any owui/*/SKILL.md lacks the required
# YAML frontmatter shape that sync_to_owui.py expects. Catches the
# silent failure mode where a SKILL.md authored by any agent (opencode,
# Claude, human) ships without frontmatter — sync_to_owui then SKIPs +
# errors, the hourly CronJob fails, and the new skill never reaches OWUI.
#
# Also gates claude/*/SKILL.md via the python-skill-tests job below
# (tests/test_skill_schema.py) — the cluster-resident MCP dispatcher
# reads that frontmatter to derive its tool schema, so malformed input
# there breaks MCP dispatch silently the same way. The test already
# existed; this workflow just wasn't triggering on the paths it covers
# (caught 2026-07-23 reviewing an unrelated claude/git-workflow PR).
#
# Validator lives upstream of that failure: PR-time, blocking, fast.

on:
  pull_request:
    paths:
      - "owui/**/SKILL.md"
      - "claude/**/SKILL.md"
      - "tests/**"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch: {}

jobs:
  validate-frontmatter:
    runs-on: skills-runner
    steps:
      - uses: actions/checkout@v7

      - name: Validate every owui/*/SKILL.md
        run: |
          set -uo pipefail
          fail=0
          checked=0

          if [ ! -d owui ]; then
            echo "no owui/ directory; nothing to validate"
            exit 0
          fi

          for f in owui/*/SKILL.md; do
            [ -f "$f" ] || continue
            checked=$((checked + 1))

            # Frontmatter must be a `---` line at the very start.
            if ! head -1 "$f" | grep -q "^---$"; then
              echo "::error file=$f,line=1::missing frontmatter — file must start with a '---' line followed by name/description/tags/scope. See AGENTS.md."
              fail=1
              continue
            fi

            # Required keys inside the frontmatter block (between the
            # first two `---` markers). sync_to_owui.py passes values
            # through verbatim — we only enforce presence here; OWUI
            # itself is the value-schema authority.
            block=$(awk '/^---$/{c++; next} c==1 {print} c>=2{exit}' "$f")
            for key in name description tags scope; do
              if ! echo "$block" | grep -qE "^${key}\s*:"; then
                echo "::error file=$f::missing required frontmatter key '$key'"
                fail=1
              fi
            done
          done

          echo ""
          if [ "$fail" = "1" ]; then
            echo "✗ Validation failed across $checked file(s). See errors above."
            echo "  Shape reference: owui/repo-protections/SKILL.md"
            echo "  Rules: AGENTS.md → 'OWUI skills must start with YAML frontmatter'"
            exit 1
          fi
          echo "✓ All $checked owui/*/SKILL.md files have valid frontmatter."

  python-skill-tests:
    # Per-skill structural tests that go deeper than frontmatter — e.g.,
    # recipe-units' pantry list shape + fixture-vs-rules consistency.
    # Migrated from homelab/bin/tests/ in homelab#225 phase 1; tests live
    # next to the code they validate.
    runs-on: skills-runner
    steps:
      - uses: actions/checkout@v7

      # actions/setup-python upgrades pip on EVERY run, which reaches
      # files.pythonhosted.org and inherits the flaky edge node from
      # homelab#1029. The retry below cannot help: the 502 happens inside the
      # action, before that step ever runs — observed on dvystrcil/skills#64,
      # 2026-08-19, "too many 502 error responses" while Upgrading pip.
      #
      # The mitigation was attached to the layer we control rather than the
      # layer that fails. So skip the action entirely when the self-hosted
      # runner image already provides what the tests need, and keep it as a
      # fallback for runners that do not.
      - name: Does this runner already have python3 + PyYAML?
        id: probe
        run: |
          if python3 -c "import yaml" 2>/dev/null; then
            echo "need-setup=false" >> "$GITHUB_OUTPUT"
            echo "runner provides $(python3 -V 2>&1) with PyYAML — skipping setup-python"
          else
            echo "need-setup=true" >> "$GITHUB_OUTPUT"
            echo "::notice::runner lacks python3+PyYAML; falling back to actions/setup-python"
          fi

      - uses: actions/setup-python@v7
        if: steps.probe.outputs.need-setup == 'true'
        with:
          python-version: '3.x'

      - name: Install PyYAML
        if: steps.probe.outputs.need-setup == 'true'
        # Retried: one Fastly edge node in PyPI's rotation serves 502s to
        # this cluster at ~15% (homelab#1029). pip's own retries reuse the
        # connection and land back on the same node; a fresh process
        # re-resolves, so three attempts take ~15% to ~0.3%.
        run: |
          for attempt in 1 2 3; do
            pip install --quiet pyyaml && exit 0
            echo "::warning::pip install failed (attempt ${attempt}/3) — retrying"
            sleep $((attempt * 10))
          done
          echo "::error::pip install failed three times"
          exit 1

      - name: Discover + run tests/test_*.py
        run: |
          if [ ! -d tests ]; then
            echo "no tests/ directory; nothing to run"
            exit 0
          fi
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Discover + run tests/test_*.sh
        # unittest discover above only picks up *.py -- bash-script tests
        # (e.g. bootstrap-infisical-ci.sh's hermetic detection-logic test)
        # need their own runner or they silently never execute in CI.
        run: |
          shopt -s nullglob
          scripts=(tests/test_*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "no tests/test_*.sh files; nothing to run"
            exit 0
          fi
          fail=0
          for s in "${scripts[@]}"; do
            echo "::group::$s"
            bash "$s" || fail=1
            echo "::endgroup::"
          done
          exit $fail
