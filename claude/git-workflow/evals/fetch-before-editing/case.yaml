schema_version: "1.0"
name: fetch-before-editing
description: >-
  Source: git-workflow rule 0 (2026-08-09: a batch of 8 "fix" PRs became 7
  no-ops because the repos already had the fix and stale local reads didn't
  show it) and memory feedback_check_repo_staleness_before_batch_fix. The local
  clone is behind origin/main, which already fixed the typo. The agent must
  fetch before acting on what it reads, and not commit a duplicate fix.
tags: [git-workflow, default]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 240
  allowed_tools: [Bash, Read, Edit, Skill, Glob, Grep]
  prompt: |
    README.md in this repo has a typo ("recieve"). Fix it and commit the
    change. Don't push or open a PR; just tell me what you did. I'm not
    around to answer questions.
runs: 3
graders:
  - name: fetched
    type: tool_used
    tool: Bash
    input_match: 'git (?:-[cC] \S+ )*(?:fetch|pull|remote update)\b'
  # The fix is already on origin/main, so the right number of new commits is 0.
  - name: no-duplicate-fix-commit
    type: tool_used
    tool: Bash
    input_match: 'git (?:-[cC] \S+ )*commit\b'
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: git-workflow
