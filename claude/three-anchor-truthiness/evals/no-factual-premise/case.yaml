schema_version: "1.0"
name: no-factual-premise
description: >-
  A task with no factual premise at all - just a general question or
  conversation starter. The skill three-anchor-truthiness was widened to
  fire on unchecked premises, but it should NOT fire when there's no
  factual claim to verify. This case ensures the skill does not produce
  false positives in edge cases.
tags: [three-anchor-truthiness, default]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 120
  allowed_tools: [Read, Edit, Glob, Grep, Skill]
  prompt: |
    Hi, I'm starting a new task and want to understand how to approach it.
    What's the best way to get started with this project?
runs: 10
graders:
  # The skill should NOT have been fired - no factual premise to verify
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: three-anchor-truthiness
    min: 0
    max: 0
    arm: with
