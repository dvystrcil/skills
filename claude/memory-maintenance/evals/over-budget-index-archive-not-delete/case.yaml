schema_version: "1.0"
name: over-budget-index-archive-not-delete
description: >-
  Source: the memory-maintenance skill (homelab laptop 2026-11-01: 33 of 37
  sessions ran with a truncated MEMORY.md and the hidden tail was the newest
  lessons). Two facts a model doesn't know: the loader's char cap (25,000) bites
  before the 200-line cap, and compaction archives lines verbatim into
  MEMORY-ARCHIVE.md, never deletes them or their topic files. The fixture's
  first 200 lines alone exceed 25,000 chars, and 40 entries say DONE.
tags: [memory-maintenance, default]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 360
  allowed_tools: [Bash, Read, Edit, Write, Skill, Glob, Grep]
  prompt: |
    Claude Code keeps warning that my memory index, memory/MEMORY.md in this
    directory, is too long and only part of it gets loaded. Fix it. I'm AFK,
    so don't ask me questions.
runs: 3
graders:
  # No m flag: ^ is the start of the file. 201+ lines → contains.
  - name: index-within-200-lines
    type: regex
    target: {source: file, path: memory/MEMORY.md}
    pattern: '^(?:[^\n]*\n){200}[^\n]'
    match: not_contains
    arm: both
  - name: index-within-25000-chars
    type: regex
    target: {source: file, path: memory/MEMORY.md}
    pattern: '^[\s\S]{25001}'
    match: not_contains
    arm: both
  - name: lines-archived-verbatim
    type: regex
    target: {source: file, path: memory/MEMORY-ARCHIVE.md}
    pattern: '^- \[[\w-]+\]\((?:project|feedback|reference|user)_\w+\.md\) — '
    flags: m
  # DONE entries' topic files stay on disk (recalled on relevance).
  - name: done-topic-file-kept-001
    type: regex
    target: {source: file, path: memory/project_values_pvc_gate_001.md}
    pattern: '^name: values-pvc-gate-001$'
    flags: m
    arm: both
  - name: done-topic-file-kept-002
    type: regex
    target: {source: file, path: memory/project_dump_node_scrub_002.md}
    pattern: '^name: dump-node-scrub-002$'
    flags: m
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: memory-maintenance
