name: skill-evals-claude

# On-demand Claude eval (skills#120 AC4): the Claude column of the keep rule,
# for a Claude model change or a fallback candidate. Never on a PR, a push or a
# schedule. It spends real money (ANTHROPIC_API_KEY from Infisical, billed per
# token; the owner's budget is $30 a month), so:
#   * one skill by default, 3 runs per arm (Claude's scores are far less noisy
#     than qwen's, which is why the PR job needs 10);
#   * a cost ceiling for the WHOLE run (default $10): bin/skill-evals.py hands
#     each case what is left and launches no case once it is spent; a ceiling
#     above $30 is refused;
#   * Infisical gives this job ANTHROPIC_API_KEY and nothing else.
# Cost guide (Opus, 2026-11-13): about $0.14 per run, so ~$0.80 per case at 3
# runs per arm, ~$6.50 for all 8 cases.
#
# Runner: skills-runner (build tier). It can reach the in-cluster Infisical,
# which the isolated eval runner's egress lock blocks, and `claude plugin eval`
# confines the agent's shell with bwrap, which needs user namespaces the
# isolated tier doesn't allow. Only people with write access can dispatch.
#
# Tests: tests/test_skill_evals_claude_workflow.py.

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill whose cases to run (e.g. file-issue), or 'all' for every default case"
        required: true
      model:
        description: "Claude model"
        type: choice
        options:
          - claude-opus-5-5
          - claude-sonnet-5-5
        default: claude-opus-5-5
      runs:
        description: "Runs per arm"
        required: false
        default: "3"
      max_cost_usd:
        description: "Cost ceiling for the whole run, USD at API prices (max 30)"
        required: false
        default: "10"

permissions:
  contents: read
  id-token: write

concurrency:
  group: skill-evals-claude
  cancel-in-progress: false

jobs:
  skill-evals-claude:
    runs-on: skills-runner
    timeout-minutes: 240
    env:
      SKILL: ${{ inputs.skill }}
      MODEL: ${{ inputs.model }}
      RUNS: ${{ inputs.runs }}
      MAX_COST_USD: ${{ inputs.max_cost_usd }}
      CLAUDE_CODE_VERSION: 2.1.325
    steps:
      - name: Budget guard
        run: |
          python3 - <<'PY'
          import os, re, sys
          cost, runs = os.environ["MAX_COST_USD"], os.environ["RUNS"]
          if not re.fullmatch(r"\d+(\.\d+)?", cost) or not 0 < float(cost) <= 30:
              sys.exit(f"max_cost_usd must be a number in (0, 30], the monthly budget: got {cost!r}")
          if not re.fullmatch(r"[1-9]\d?", runs):
              sys.exit(f"runs must be 1-99: got {runs!r}")
          if not re.fullmatch(r"all|[a-z0-9-]+", os.environ["SKILL"]):
              sys.exit(f"skill must be a skill directory name or 'all': got {os.environ['SKILL']!r}")
          print(f"ceiling ${float(cost):.2f} for {os.environ['SKILL']} x {runs} runs/arm")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Install PyYAML, bubblewrap, socat and Claude Code (pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet pyyaml
          # claude plugin eval confines the agent's shell with bwrap (+ socat).
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat >/dev/null
          npm install -g --prefix "$RUNNER_TEMP/npm" "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm/bin/claude" --version

      - name: Fetch ANTHROPIC_API_KEY (one secret, not the store)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: ANTHROPIC_API_KEY
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Run the evals
        run: |
          set -o pipefail
          args=(--model "$MODEL" --runs "$RUNS" --max-cost-usd "$MAX_COST_USD"
                --tag default --keep --out evals-out)
          if [ "$SKILL" != all ]; then
            args+=(--skill "$SKILL")
          fi
          python3 bin/skill-evals.py "${args[@]}" | tee evals-out.log

      - name: Summary
        if: always()
        run: cat evals-out/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skill-evals-claude
          path: evals-out
          if-no-files-found: ignore
          retention-days: 14
