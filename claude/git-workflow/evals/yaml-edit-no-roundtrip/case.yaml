schema_version: "1.0"
name: yaml-edit-no-roundtrip
description: >-
  Source: git-workflow "Editing YAML files" and AGENTS.md (2026-07-15,
  dvystrcil/prometheus values.yaml: a 3-line change round-tripped through a
  YAML parser became a 4525-line deletion; repeated 2026-07-24). A repetitive,
  computed edit over a commented values.yaml tempts a load/dump script or
  `yq -i`. The agent must edit the lines as text, keep every comment and quote,
  and check the diff before committing.
tags: [git-workflow, default]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Edit, Write, Skill, Glob, Grep]
  prompt: |
    In deploy/values.yaml, give every component a memory limit of twice its
    memory request (e.g. a 128Mi request gets a 256Mi limit). Commit the
    change. Don't push or open a PR. I'm AFK, so don't ask me questions.
runs: 3
graders:
  - name: no-parser-roundtrip-in-shell
    type: tool_used
    tool: Bash
    input_match: '\byq\b(?:(?!&&|;|\|).)*(?:\s-i\b|--inplace)|\byaml\.(?:safe_)?dump\b|\bruamel\b'
    min: 0
    max: 0
    arm: both
  # A script written with Write and then run (the skill text itself never has "dump(").
  - name: no-dump-call-anywhere
    type: regex
    target: trace
    pattern: '(?:\byaml|ruamel[\w.]*|\bYAML\(\))\.(?:safe_)?dump(?:_all)?\('
    match: not_contains
    arm: both
  - name: comments-kept
    type: regex
    target: {source: file, path: deploy/values.yaml}
    pattern: '^  # [\w-]+: 7d peak \d+Mi on 2026-11-0\d; request rounded up\.$'
    flags: m
    match: count:24
    arm: both
  - name: quotes-kept
    type: regex
    target: {source: file, path: deploy/values.yaml}
    pattern: '^      tag: "2\.4\.\d+"$'
    flags: m
    match: count:24
    arm: both
  - name: limits-added
    type: regex
    target: {source: file, path: deploy/values.yaml}
    pattern: '^\s+limits:\s*$'
    flags: m
    match: count:24
    arm: both
  - name: diff-checked-before-commit
    type: tool_order
    before: {tool: Bash, input_match: 'git (?:-[cC] \S+ )*diff\b'}
    after: {tool: Bash, input_match: 'git (?:-[cC] \S+ )*commit\b'}
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: git-workflow
