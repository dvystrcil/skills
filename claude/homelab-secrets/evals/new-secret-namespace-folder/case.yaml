schema_version: "1.0"
name: new-secret-namespace-folder
description: >-
  Source: dvystrcil/n8n-workflow#416 (2026-11-23). A new secret read only by one
  namespace goes in the Infisical folder named after that namespace, not at /,
  because CI jobs read / with export-type env (homelab#2321). Before this case
  the skill's own template said secretsPath "/". The agent must point the new
  InfisicalSecret at /billing, the namespace in ./deploy/kustomization.yaml.
tags: [homelab-secrets, default]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 240
  allowed_tools: [Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    The app in ./deploy needs a new API key in the STRIPE_API_KEY env var. I
    have already added it to Infisical. Wire it into the kustomize manifests in
    ./deploy so the pod gets it. Edit the files directly; don't ask me
    questions, I'm not around.
runs: 3
graders:
  - name: reads-namespace-folder
    type: regex
    target: trace
    pattern: 'secretsPath: ?\\?"?/billing'
  - name: not-root-path
    type: regex
    target: trace
    pattern: 'secretsPath: ?\\?"?/\\?"?(\\n|\\\\n|$)'
    match: not_contains
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: homelab-secrets
