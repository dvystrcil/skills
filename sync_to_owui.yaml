apiVersion: batch/v1
kind: CronJob
metadata:
  name: skill-sync
  namespace: open-webui
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # homelab#666: without this, a Failed Job never gets garbage-collected
      # and Alertmanager's KubeJobFailed rule keeps re-firing on things
      # already over.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: python:3.12-alpine
              command:
                - sh
                - -c
                # DATABASE_URL: CNPG's app URI pointed at the Pooler
                # (dvystrcil/argocd-projects#310). fqdn-uri names the primary,
                # owui-postgres-rw; swap in owui-postgres-pooler-rw and leave
                # the URL-encoded password alone. Same swap as open-webui's
                # base/pooler-database-url.py. The assignment carries
                # python's exit status, so an unexpected host stops the job.
                - |
                  DATABASE_URL="$(python -c 'import os, sys
                  rw = "@owui-postgres-rw.open-webui.svc.cluster.local:"
                  u = os.environ.get("DB_URL_RW", "")
                  if u.count(rw) != 1: sys.exit("skill-sync: DB_URL_RW does not name host " + rw.strip("@:") + " exactly once")
                  sys.stdout.write(u.replace(rw, "@owui-postgres-pooler-rw.open-webui.svc.cluster.local:"))')" || exit 1
                  export DATABASE_URL
                  pip install psycopg2-binary --quiet && \
                  SKILLS_FLAT_DIR=/skills python /skills/sync_to_owui.py
              env:
                - name: DB_URL_RW
                  valueFrom:
                    secretKeyRef:
                      name: owui-postgres-app
                      key: fqdn-uri
              volumeMounts:
                - name: skills
                  mountPath: /skills
          volumes:
            - name: skills
              configMap:
                name: owui-skills
