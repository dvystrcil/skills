schema_version: "1.0"
name: follow-up-goes-to-draft-issue
description: >-
  Source: the file-issue skill and memory project_issue_intake (ideas and
  todos go to homelab/bin/draft-issue.py on the local model; writing the issue
  in Claude Code costs tokens for gathering and formatting, and bare
  `gh issue create` skips the duplicate search and template gate). Asked to
  file a simple follow-up, the agent must hand it to draft-issue.py with what
  it knows in --context, not write the body and `gh issue create` it.
tags: [file-issue, default]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 240
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
  prompt: |
    While bumping obico just now I noticed deploy/cronjob-tasks.yaml in this
    repo has a memory request but no memory limit. That's not part of the
    bump, so don't fix it. Open a follow-up issue on dvystrcil/printfarm-ops
    so it gets tracked. I'm AFK, so don't ask me questions.
runs: 3
graders:
  # draft-issue.py run at command position (cat/sed of the file doesn't count),
  # and not only as a --dry-run or --help.
  - name: handed-to-draft-issue
    type: tool_used
    tool: Bash
    input_match: '^(?![\s\S]*(?:--dry-run|--help|\s-h\b))[\s\S]*(?:^|"command":"|[;&|(]\s*|\bpython3?\s+)(?:\S*/)?draft-issue\.py\s'
  - name: no-bare-gh-issue-create
    type: tool_used
    tool: Bash
    input_match: '\bgh\s+(?:-\S+\s+\S+\s+)*issue\s+create\b|\bgh\s+api\b[^"]*/issues\b'
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: file-issue
